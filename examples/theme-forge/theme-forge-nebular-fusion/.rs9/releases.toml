schema = "rs9.releases.v1alpha1"

[release]
tag = "v{version}"
prerelease = "reject"

[evidence]
profile = "tauri-desktop-archive.v1alpha1"
checksums = "SHA256SUMS"
assets = [
  { role = "provenance", name = "PROVENANCE.json" },
  { role = "sbom-spdx", name = "nebular.spdx.json" },
  { role = "third-party-notices", name = "THIRD_PARTY_NOTICES.md" },
  { role = "npm-wrapper", name = "knowledge-forge-ai-theme-forge-nebular-fusion-{version}.tgz" },
]

[[assets]]
id = "darwin-arm64"
name = "theme-forge-nebular-fusion-v{version}-aarch64-apple-darwin.app.tar.gz"
format = "tar.gz"
platforms = ["aarch64-darwin"]
commands = { tfnf = "Theme Forge Nebular Fusion.app/Contents/MacOS/theme-forge-nebular-fusion" }
launchers = { tfnf = "Theme Forge Nebular Fusion.app/Contents/Resources/bin/tfnf" }

[[assets]]
id = "linux-arm64"
name = "theme-forge-nebular-fusion-v{version}-aarch64-unknown-linux-gnu.tar.gz"
format = "tar.gz"
platforms = ["aarch64-linux"]
commands = { tfnf = "theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion" }
launchers = { tfnf = "theme-forge-nebular-fusion/bin/tfnf" }

[[assets]]
id = "linux-x64"
name = "theme-forge-nebular-fusion-v{version}-x86_64-unknown-linux-gnu.tar.gz"
format = "tar.gz"
platforms = ["x86_64-linux"]
commands = { tfnf = "theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion" }
launchers = { tfnf = "theme-forge-nebular-fusion/bin/tfnf" }
