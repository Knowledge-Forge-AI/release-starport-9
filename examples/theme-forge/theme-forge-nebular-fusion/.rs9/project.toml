schema = "rs9.project.v1alpha1"
# RS9 stand-in illustration; no tenant adoption claim.

[project]
id = "theme-forge-nebular-fusion"
name = "Theme Forge Nebular Fusion"
repository = "Knowledge-Forge-AI/theme-forge-nebular-fusion"
family = "theme-forge"
summary = "Evidence-bound Theme Forge integration workbench"

[license]
# Tagged community expression; published npm artifact authority conflicts.
expression = "AGPL-3.0-or-later"
status = "unresolved"
source = "tagged-repository"
files = ["LICENSE", "NOTICE"]

[runtime]
kind = "native"

[desktop]
command = "tfnf"
categories = ["Development"]

[desktop.icon]
source = "tagged-repository"
path = "src-tauri/icons/icon.png"

[[commands]]
name = "tfnf"
interface = "gui"

[[checks]]
id = "version"
argv = ["tfnf", "--version"]
expect-exit = 0
expect-stdout-contains = "theme-forge-nebular-fusion {version}"
requires-display = true
