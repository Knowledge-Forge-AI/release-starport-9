name: Publish the RS9 CLI 0.1.0 to PyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: rs9-cli-v010-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Knowledge-Forge-AI/release-starport-9' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify the release and admit the two PyPI artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Knowledge-Forge-AI/release-starport-9
        run: |
          ref=$(gh api "repos/${GH_REPO}/git/ref/tags/v0.1.0" --jq 'select(.object.type == "tag") | .object.sha')
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          commit=$(gh api "repos/${GH_REPO}/git/tags/${ref}" --jq 'select(.tag == "v0.1.0" and .object.type == "commit") | .object.sha')
          test "$commit" = 4b7c9c77749eb833b99c64c2fc501aae44fea82d
          published=$(gh api "repos/${GH_REPO}/releases/tags/v0.1.0" --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          test "$published" = v0.1.0

          mkdir -- dist
          gh release download v0.1.0 --repo "$GH_REPO" --dir dist \
            --pattern release_starport_9-0.1.0-py3-none-any.whl \
            --pattern release_starport_9-0.1.0.tar.gz
          cd dist
          shopt -s dotglob nullglob
          files=(*)
          test "${#files[@]}" -eq 2
          test -f release_starport_9-0.1.0-py3-none-any.whl
          test -f release_starport_9-0.1.0.tar.gz
          test ! -L release_starport_9-0.1.0-py3-none-any.whl
          test ! -L release_starport_9-0.1.0.tar.gz
          sha256sum -c - <<'CHECKSUMS'
          8eca005afde7134e0dcb0e817b58f9b0e1ffe12a1e8697ba9a67123b28f84b57  release_starport_9-0.1.0-py3-none-any.whl
          95766cfc6c99cd61eea4a9c146a5ae2ae6776469f8e513676177cb4fd1bd1840  release_starport_9-0.1.0.tar.gz
          CHECKSUMS

      - name: Publish the verified artifacts
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: dist/
