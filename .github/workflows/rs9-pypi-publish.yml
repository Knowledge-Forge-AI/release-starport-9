name: RS9 PyPI Publish
run-name: 'RS9 PyPI ${{ inputs.prepared_sha256 }} / ${{ inputs.dispatch_id }}'

on:
  workflow_dispatch:
    inputs:
      prepared_sha256:
        description: 'Correlation digest only; committed artifact pins own the upload set'
        required: false
        type: string
      dispatch_id:
        description: 'Unique attended intent correlation; not publication authority'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rs9-pypi-publish
  cancel-in-progress: false

jobs:
  download_verify:
    if: github.ref == 'refs/heads/main'
    name: Download and Verify PyPI Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download and verify exact pinned artifacts
        env:
          PYTHONPATH: src
        run: python3 -B -m rs9.apgr7_pypi_workflow download

      - name: Stage verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-artifacts
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish_pypi:
    if: github.ref == 'refs/heads/main'
    name: Trusted Publishing to PyPI
    needs: [download_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-praxis-grimoire
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/

      - name: Verify artifact integrity and select only missing files
        id: missing
        env:
          PYTHONPATH: src
        run: python3 -B -m rs9.apgr7_pypi_workflow select-missing >> "$GITHUB_OUTPUT"

      - name: Publish package distributions to PyPI
        if: steps.missing.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: dist/
