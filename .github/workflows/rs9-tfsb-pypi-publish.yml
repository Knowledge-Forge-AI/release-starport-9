name: RS9 theme-forge-stellar-burst PyPI Publish
run-name: 'RS9 theme-forge-stellar-burst ${{ inputs.mode }} / ${{ inputs.dispatch_id }}'

on:
  push:
    branches: [rs9-tf-pypi-hostqual1]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - qualify
          - publish
          - resume
        default: qualify
      dispatch_id:
        description: 'Unique attended intent correlation; not publication authority'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rs9-tfsb-pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_verify:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rs9-tf-pypi-hostqual1') && inputs.mode != 'resume'
    name: Build and Verify Candidate Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Build and verify package distributions
        env:
          PYTHONPATH: src
        run: python3 -B -m rs9.tf_pypi_publish build --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json --output dist

      - name: Stage verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-artifacts
          path: dist/
          retention-days: 1
          if-no-files-found: error

  native_darwin_arm64:
    name: Native macOS ARM64 installed consumer
    needs: [build_verify]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download the same run's verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/
      - name: Test exact wheel and sdist with networking denied
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFY_COMMIT: '${{ github.sha }}'
          QUALIFY_RUN_ID: '${{ github.run_id }}'
          QUALIFY_RUN_ATTEMPT: '${{ github.run_attempt }}'
        shell: bash
        run: |
          set -euo pipefail
          PHYSICAL_TMP="$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR="$PHYSICAL_TMP" TMP="$PHYSICAL_TMP" TEMP="$PHYSICAL_TMP"
          PHYSICAL_RUNNER_TEMP="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir -p "$PHYSICAL_RUNNER_TEMP/tf-consumer-report"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            python3 -B -m rs9.tf_pypi_hosted qualify --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --target darwin-arm64 \
            --dist "$GITHUB_WORKSPACE/dist" --work "$PHYSICAL_RUNNER_TEMP/tf-consumer" \
            --report "$PHYSICAL_RUNNER_TEMP/tf-consumer-report/result.json" \
            --expected-commit "$QUALIFY_COMMIT" \
            --run-id "$QUALIFY_RUN_ID" --run-attempt "$QUALIFY_RUN_ATTEMPT"
      - name: Preserve native consumer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-consumer-theme-forge-stellar-burst-darwin-arm64
          path: '${{ runner.temp }}/tf-consumer-report/'
          retention-days: 14
          if-no-files-found: error

  native_linux_arm64:
    name: Native Linux ARM64 GNU installed consumer
    needs: [build_verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download the same run's verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/
      - name: Test exact wheel and sdist with networking denied
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFY_COMMIT: '${{ github.sha }}'
          QUALIFY_RUN_ID: '${{ github.run_id }}'
          QUALIFY_RUN_ATTEMPT: '${{ github.run_attempt }}'
        shell: bash
        run: |
          set -euo pipefail
          PHYSICAL_TMP="$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR="$PHYSICAL_TMP" TMP="$PHYSICAL_TMP" TEMP="$PHYSICAL_TMP"
          PHYSICAL_RUNNER_TEMP="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir -p "$PHYSICAL_RUNNER_TEMP/tf-consumer-report"
          python3 -B -m rs9.tf_pypi_hosted qualify --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --target linux-arm64-gnu \
            --dist "$GITHUB_WORKSPACE/dist" --work "$PHYSICAL_RUNNER_TEMP/tf-consumer" \
            --report "$PHYSICAL_RUNNER_TEMP/tf-consumer-report/result.json" \
            --expected-commit "$QUALIFY_COMMIT" \
            --run-id "$QUALIFY_RUN_ID" --run-attempt "$QUALIFY_RUN_ATTEMPT"
      - name: Preserve native consumer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-arm64-gnu
          path: '${{ runner.temp }}/tf-consumer-report/'
          retention-days: 14
          if-no-files-found: error

  native_linux_x64:
    name: Native Linux x86_64 GNU installed consumer
    needs: [build_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download the same run's verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/
      - name: Test exact wheel and sdist with networking denied
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFY_COMMIT: '${{ github.sha }}'
          QUALIFY_RUN_ID: '${{ github.run_id }}'
          QUALIFY_RUN_ATTEMPT: '${{ github.run_attempt }}'
        shell: bash
        run: |
          set -euo pipefail
          PHYSICAL_TMP="$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR="$PHYSICAL_TMP" TMP="$PHYSICAL_TMP" TEMP="$PHYSICAL_TMP"
          PHYSICAL_RUNNER_TEMP="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir -p "$PHYSICAL_RUNNER_TEMP/tf-consumer-report"
          python3 -B -m rs9.tf_pypi_hosted qualify --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --target linux-x64-gnu \
            --dist "$GITHUB_WORKSPACE/dist" --work "$PHYSICAL_RUNNER_TEMP/tf-consumer" \
            --report "$PHYSICAL_RUNNER_TEMP/tf-consumer-report/result.json" \
            --expected-commit "$QUALIFY_COMMIT" \
            --run-id "$QUALIFY_RUN_ID" --run-attempt "$QUALIFY_RUN_ATTEMPT"
      - name: Preserve native consumer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-x64-gnu
          path: '${{ runner.temp }}/tf-consumer-report/'
          retention-days: 14
          if-no-files-found: error

  qualification_gate:
    name: Three-host qualification gate
    needs: [build_verify, native_darwin_arm64, native_linux_arm64, native_linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Download staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/
      - name: Download darwin-arm64 consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-darwin-arm64
          path: receipts/darwin-arm64/
      - name: Download linux-arm64-gnu consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-arm64-gnu
          path: receipts/linux-arm64-gnu/
      - name: Download linux-x64-gnu consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-x64-gnu
          path: receipts/linux-x64-gnu/
      - name: Admit three-host native matrix receipts
        env:
          PYTHONPATH: src
          QUALIFY_COMMIT: '${{ github.sha }}'
          QUALIFY_RUN_ID: '${{ github.run_id }}'
          QUALIFY_RUN_ATTEMPT: '${{ github.run_attempt }}'
        run: python3 -B -m rs9.tf_pypi_hosted admit --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json --dist dist --receipts receipts --expected-commit "$QUALIFY_COMMIT" --run-id "$QUALIFY_RUN_ID" --run-attempt "$QUALIFY_RUN_ATTEMPT"

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    name: Trusted Publishing to PyPI
    needs: [build_verify, native_darwin_arm64, native_linux_arm64, native_linux_x64, qualification_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/theme-forge-stellar-burst
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Download staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: dist/
      - name: Download darwin-arm64 consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-darwin-arm64
          path: receipts/darwin-arm64/
      - name: Download linux-arm64-gnu consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-arm64-gnu
          path: receipts/linux-arm64-gnu/
      - name: Download linux-x64-gnu consumer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-consumer-theme-forge-stellar-burst-linux-x64-gnu
          path: receipts/linux-x64-gnu/

      - name: Verify artifact integrity and select only missing files
        id: missing
        env:
          PYTHONPATH: src
          QUALIFY_COMMIT: '${{ github.sha }}'
          QUALIFY_RUN_ID: '${{ github.run_id }}'
          QUALIFY_RUN_ATTEMPT: '${{ github.run_attempt }}'
        run: python3 -B -m rs9.tf_pypi_publish select-missing --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json --dist dist --upload-dir upload --receipts receipts --expected-commit "$QUALIFY_COMMIT" --run-id "$QUALIFY_RUN_ID" --run-attempt "$QUALIFY_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Publish package distributions to PyPI
        if: steps.missing.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: upload/

      - name: Read back published PyPI state
        env:
          PYTHONPATH: src
        run: python3 -B -m rs9.tf_pypi_publish readback --project theme-forge-stellar-burst --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json --dist dist

  publication_resume:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'resume'
    name: Attended Burst 0.7.0 PyPI publication resume
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/theme-forge-stellar-burst
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout current publisher authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout original qualification source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 'e35ed6dfbe38f601db9b329c34331a170580372a'
          path: qualification-source
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Verify source lineage and original helper hashes
        env:
          PYTHONPATH: src
          PUBLISHER_REVISION: '${{ github.sha }}'
        run: |
          set -euo pipefail
          python3 -B -m rs9.tf_pypi_resume verify-source \
            --publisher-root "$GITHUB_WORKSPACE" \
            --publisher-revision "$PUBLISHER_REVISION" \
            --qualification-source "$GITHUB_WORKSPACE/qualification-source"

      - name: Read exact first-attempt artifact metadata and archives
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p remote-metadata archives
          gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/Knowledge-Forge-AI/release-starport-9/actions/runs/40427947585" \
            > "remote-metadata/run.json"
          gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/Knowledge-Forge-AI/release-starport-9/actions/runs/40427947585/attempts/1/jobs?per_page=100" \
            > "remote-metadata/jobs.json"
          for artifact_id in 12701155653 12700482027 12700432813 12700053808; do
            gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/Knowledge-Forge-AI/release-starport-9/actions/artifacts/$artifact_id" \
              > "remote-metadata/$artifact_id.json"
            gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/Knowledge-Forge-AI/release-starport-9/actions/artifacts/$artifact_id/zip" \
              > "archives/$artifact_id.zip"
          done

      - name: Validate original archives and materialize the held candidate
        env:
          PYTHONPATH: src
          PUBLISHER_REVISION: '${{ github.sha }}'
        run: |
          set -euo pipefail
          python3 -B -m rs9.tf_pypi_resume prepare \
            --capture operators/tf-pypi/theme-forge-stellar-burst-0.7.0-qualification.json \
            --metadata-dir remote-metadata --archive-dir archives --output resume \
            --publisher-root "$GITHUB_WORKSPACE" \
            --publisher-revision "$PUBLISHER_REVISION"

      - name: Stage promoted metadata into the original qualification checkout
        env:
          PYTHONPATH: src
          PUBLISHER_REVISION: '${{ github.sha }}'
        run: |
          set -euo pipefail
          python3 -B -m rs9.tf_pypi_resume stage-metadata \
            --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --approval operators/tf-pypi/theme-forge-stellar-burst-0.7.0-artifacts.json \
            --qualification-source qualification-source \
            --publisher-root "$GITHUB_WORKSPACE" \
            --publisher-revision "$PUBLISHER_REVISION"

      - name: Verify approved candidate and select only missing files
        id: missing
        env:
          PYTHONPATH: src
          QUALIFY_COMMIT: 'e35ed6dfbe38f601db9b329c34331a170580372a'
          QUALIFY_RUN_ID: '40427947585'
          QUALIFY_RUN_ATTEMPT: '1'
        run: |
          set -euo pipefail
          python3 -B -m rs9.tf_pypi_publish select-missing \
            --project theme-forge-stellar-burst \
            --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --dist "$GITHUB_WORKSPACE/resume/dist" \
            --upload-dir "$GITHUB_WORKSPACE/resume/upload" \
            --receipts "$GITHUB_WORKSPACE/resume/receipts" \
            --expected-commit "$QUALIFY_COMMIT" \
            --run-id "$QUALIFY_RUN_ID" \
            --run-attempt "$QUALIFY_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        working-directory: qualification-source

      - name: Publish package distributions to PyPI
        if: steps.missing.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: resume/upload/

      - name: Read back exact PyPI state
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -B -m rs9.tf_pypi_publish readback \
            --project theme-forge-stellar-burst \
            --pin operators/tf-pypi/theme-forge-stellar-burst-0.7.0.json \
            --dist "$GITHUB_WORKSPACE/resume/dist"
        working-directory: qualification-source
