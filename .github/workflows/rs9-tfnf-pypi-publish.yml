name: RS9 theme-forge-nebular-fusion PyPI Publish
run-name: "RS9 theme-forge-nebular-fusion ${{ inputs.release || '0.6.1' }} ${{ inputs.mode || 'qualify' }} / ${{ inputs.dispatch_id }}"

on:
  push:
    branches: [rs9-tfnf-pypi-hostqual1]
  workflow_dispatch:
    inputs:
      release:
        description: 'Target Nebular release'
        required: false
        type: choice
        options:
          - 0.6.1
          - 0.7.0
        default: 0.6.1
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - qualify
          - publish
          - universal-qualify
          - universal-publish
        default: qualify
      dispatch_id:
        description: 'Unique attended intent correlation; not publication authority'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rs9-tfnf-pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_verify:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rs9-tfnf-pypi-hostqual1') && ((github.event_name == 'push') || (inputs.release == '0.6.1' && (inputs.mode == 'qualify' || inputs.mode == 'publish')))
    name: Build and Verify Native Darwin Wheel
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Build and verify candidate wheel
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          RS9_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular build \
            --output dist --scratch "${{ runner.temp }}/tfnf-build"

      - name: Stage verified wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-artifacts
          path: dist/
          retention-days: 1
          if-no-files-found: error

  native_consumer:
    if: github.event_name == 'push' || (inputs.release == '0.6.1' && (inputs.mode == 'qualify' || inputs.mode == 'publish'))
    name: Native macOS ARM64 installed consumer and Scenario A
    needs: [build_verify]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download the same run's verified wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-artifacts
          path: '${{ runner.temp }}/tfnf-dist'

      - name: Prepare authenticated captures and verifier closure outside network denial
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          RS9_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular prepare \
            --output "${{ runner.temp }}/tfnf-inputs"

      - name: Qualify installed wheel and Darwin Scenario A under network denial
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFY_COMMIT: '${{ github.sha }}'
          SUPERVISOR_PYTHON: '${{ steps.setup_python.outputs.python-path }}'
        shell: bash
        run: |
          set -euo pipefail
          PHYSICAL_TMP="$("$SUPERVISOR_PYTHON" -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          export TMPDIR="$PHYSICAL_TMP" TMP="$PHYSICAL_TMP" TEMP="$PHYSICAL_TMP"
          PHYSICAL_RUNNER_TEMP="$("$SUPERVISOR_PYTHON" -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir -p "$PHYSICAL_RUNNER_TEMP/tfnf-consumer-report"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(allow process-exec (with no-sandbox) (literal "/bin/ps"))' \
            "$SUPERVISOR_PYTHON" -B -m rs9.tf_pypi_nebular qualify \
            --dist "$PHYSICAL_RUNNER_TEMP/tfnf-dist" \
            --work "$PHYSICAL_RUNNER_TEMP/tfnf-consumer" \
            --nebular-capture "$PHYSICAL_RUNNER_TEMP/tfnf-inputs/captures/nebular/theme-forge-nebular-fusion" \
            --stellar-capture "$PHYSICAL_RUNNER_TEMP/tfnf-inputs/captures/stellar/theme-forge-stellar-burst" \
            --closure "$PHYSICAL_RUNNER_TEMP/tfnf-inputs/verifier-closure" \
            --python39 /usr/bin/python3 \
            --report "$PHYSICAL_RUNNER_TEMP/tfnf-consumer-report/result.json" \
            --expected-commit "$QUALIFY_COMMIT" \
            --require-clean

      - name: Preserve native consumer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-consumer-theme-forge-nebular-fusion
          path: '${{ runner.temp }}/tfnf-consumer-report/'
          retention-days: 14
          if-no-files-found: error

  universal_prepare_public_inputs_070:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release == '0.7.0' && inputs.mode == 'universal-qualify'
    name: Prepare Nebular 0.7.0 universal launcher inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Resolve current source tree
        id: source_tree
        run: |
          set -euo pipefail
          printf 'tree=%s\n' "$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Prepare held 0.7.0 public inputs
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular070_publish prepare-public-inputs-070 \
            --manifest operators/tf-pypi/theme-forge-nebular-fusion-0.7.0-public-inputs.json \
            --output "${{ runner.temp }}/tfnf-070-universal-public-inputs" \
            --repository "$GITHUB_WORKSPACE" \
            --stage-a-spec stage-a-files.json \
            --rs9-commit "${{ github.sha }}" \
            --rs9-tree "${{ steps.source_tree.outputs.tree }}" \
            --tf-producer-commit 79c67bb70d800701b4b0cdbb9caa9be2bbc7c2ff \
            --tf-producer-tree e663c9cf15144578a17d3cd501cf031ac83a7e0e

      - name: Upload 0.7.0 public inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-public-inputs
          path: '${{ runner.temp }}/tfnf-070-universal-public-inputs/'
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  universal_build_verify_070:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release == '0.7.0' && inputs.mode == 'universal-qualify'
    name: Build and Verify Nebular 0.7.0 Universal Launcher
    needs: [universal_prepare_public_inputs_070]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Download 0.7.0 public inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-public-inputs
          path: '${{ runner.temp }}/tfnf-070-universal-public-inputs'

      - name: Build and verify one universal launcher wheel
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular070_universal build-bundle \
            --qualification-inputs "${{ runner.temp }}/tfnf-070-universal-public-inputs/qualification-inputs-prep.json" \
            --inrun-root "${{ runner.temp }}/tfnf-070-universal-public-inputs" \
            --output "${{ runner.temp }}/tfnf-070-universal-bundle" \
            --expected-commit "${{ github.sha }}" \
            --require-clean

      - name: Upload 0.7.0 candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-candidate-bundle
          path: '${{ runner.temp }}/tfnf-070-universal-bundle/'
          retention-days: 14
          if-no-files-found: error

  universal_native_consumer_070_darwin_arm64:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release == '0.7.0' && inputs.mode == 'universal-qualify'
    name: Universal installed consumer 0.7.0 (darwin-arm64)
    needs: [universal_build_verify_070]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download 0.7.0 candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-candidate-bundle
          path: '${{ runner.temp }}/tfnf-070-universal-bundle'

      - name: Download 0.7.0 public inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-public-inputs
          path: '${{ runner.temp }}/tfnf-070-universal-public-inputs'

      - name: Qualify native consumer on darwin-arm64
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular070_universal qualify-native \
            --target darwin-arm64 \
            --qualification-inputs "${{ runner.temp }}/tfnf-070-universal-public-inputs/qualification-inputs-prep.json" \
            --inrun-root "${{ runner.temp }}/tfnf-070-universal-public-inputs" \
            --raw-release "${{ runner.temp }}/tfnf-070-universal-raw-release-darwin-arm64/raw_release.json" \
            --bundle "${{ runner.temp }}/tfnf-070-universal-bundle" \
            --work "${{ runner.temp }}/tfnf-070-universal-work-darwin-arm64" \
            --output "${{ runner.temp }}/tfnf-070-universal-qual/darwin-arm64/result.json" \
            --expected-commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Upload darwin-arm64 qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-qualification-darwin-arm64
          path: '${{ runner.temp }}/tfnf-070-universal-qual/'
          retention-days: 14
          if-no-files-found: error

      - name: Upload failed native harness report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-qualification-darwin-arm64-failure-diagnostic
          path: '${{ runner.temp }}/tfnf-070-universal-work-darwin-arm64/installed-native-smoke/**/*.run.json'
          retention-days: 14
          if-no-files-found: ignore

  universal_native_consumer_070_linux_arm64_gnu:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release == '0.7.0' && inputs.mode == 'universal-qualify'
    name: Universal installed consumer 0.7.0 (linux-arm64-gnu)
    needs: [universal_build_verify_070]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install minimal Ubuntu display tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11

      - name: Verify Ubuntu display tool class
        shell: bash
        run: |
          set -euo pipefail
          for tool in xvfb-run xauth dbus-run-session; do
            command -v "$tool" >/dev/null
          done
          for package in xvfb xauth dbus-x11; do
            dpkg-query -W -f='${Version}' "$package" >/dev/null
          done
          {
            printf 'platform=ubuntu-runner\n'
            dpkg-query -W -f='${Package}\t${Version}\n' xvfb xauth dbus-x11
            for tool in xvfb-run xauth dbus-run-session; do
              printf 'tool=%s path=%s\n' "$tool" "$(command -v "$tool")"
            done
          } | tee "${{ runner.temp }}/tfnf-070-universal-display-tools.tsv"

      - name: Download 0.7.0 candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-candidate-bundle
          path: '${{ runner.temp }}/tfnf-070-universal-bundle'

      - name: Download 0.7.0 public inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-public-inputs
          path: '${{ runner.temp }}/tfnf-070-universal-public-inputs'

      - name: Resolve explicit Linux runtime profile
        id: linux_runtime_profile
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFICATION_INPUTS: '${{ runner.temp }}/tfnf-070-universal-public-inputs/qualification-inputs-prep.json'
          INRUN_ROOT: '${{ runner.temp }}/tfnf-070-universal-public-inputs'
        run: |
          set -euo pipefail
          PROFILE="$("${{ steps.setup_python.outputs.python-path }}" -B - <<'PY'
          import os
          from pathlib import Path
          from rs9.tf_pypi_nebular070_publish import (
              SYSTEM_WEBKIT_RUNTIME_PROFILE,
              load_qualification_inputs_descriptor,
          )

          descriptor = load_qualification_inputs_descriptor(
              Path(os.environ["QUALIFICATION_INPUTS"]),
              repository=Path(os.environ["GITHUB_WORKSPACE"]),
              phase="qualification-prep",
              inrun_root=Path(os.environ["INRUN_ROOT"]),
          )
          if "system_webkit" not in descriptor or "manylinux" in descriptor:
              raise SystemExit("universal launcher requires system WebKit inputs")
          if "system_webkit" in descriptor:
              print(SYSTEM_WEBKIT_RUNTIME_PROFILE)
          elif "manylinux" in descriptor:
              print("manylinux")
          else:
              raise SystemExit("explicit runtime profile missing")
          PY
          )"
          case "$PROFILE" in
            manylinux|system-webkitgtk-4.1) ;;
            *) echo "unsupported runtime profile" >&2; exit 1 ;;
          esac
          printf 'profile=%s\n' "$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Install Ubuntu system WebKit runtime packages
        if: steps.linux_runtime_profile.outputs.profile == 'system-webkitgtk-4.1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libsoup-3.0-0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0

      - name: Verify Ubuntu system WebKit runtime packages
        if: steps.linux_runtime_profile.outputs.profile == 'system-webkitgtk-4.1'
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${Package}\t${Version}\n' libgtk-3-0t64 libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libsoup-3.0-0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            | tee "${{ runner.temp }}/tfnf-070-universal-system-webkit-packages.tsv"
          ldconfig -p | grep -F 'libwebkit2gtk-4.1.so.0' >/dev/null
          ldconfig -p | grep -F 'libjavascriptcoregtk-4.1.so.0' >/dev/null

      - name: Qualify native consumer on linux-arm64-gnu
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "${{ steps.setup_python.outputs.python-path }}" -B -m rs9.tf_pypi_nebular070_universal qualify-native \
            --target linux-arm64-gnu \
            --qualification-inputs "${{ runner.temp }}/tfnf-070-universal-public-inputs/qualification-inputs-prep.json" \
            --inrun-root "${{ runner.temp }}/tfnf-070-universal-public-inputs" \
            --raw-release "${{ runner.temp }}/tfnf-070-universal-raw-release-linux-arm64-gnu/raw_release.json" \
            --bundle "${{ runner.temp }}/tfnf-070-universal-bundle" \
            --work "${{ runner.temp }}/tfnf-070-universal-work-linux-arm64-gnu" \
            --output "${{ runner.temp }}/tfnf-070-universal-qual/linux-arm64-gnu/result.json" \
            --expected-commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --consumer-host-role newer

      - name: Upload linux-arm64-gnu qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-qualification-linux-arm64-gnu
          path: '${{ runner.temp }}/tfnf-070-universal-qual/'
          retention-days: 14
          if-no-files-found: error

      - name: Upload failed native harness report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfnf-070-universal-qualification-linux-arm64-gnu-failure-diagnostic
          path: '${{ runner.temp }}/tfnf-070-universal-work-linux-arm64-gnu/installed-native-smoke/**/*.run.json'
          retention-days: 14
          if-no-files-found: ignore

  universal_native_consumer_070_linux_x64_gnu:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release == '0.7.0' && inputs.mode == 'universal-qualify'
    name: Universal installed consumer 0.7.0 (linux-x64-gnu)
    needs: [universal_build_verify_070]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: Set up Python 3.13
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install minimal Ubuntu display tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11

      - name: Verify Ubuntu display tool class
        shell: bash
        run: |
          set -euo pipefail
          for tool in xvfb-run xauth dbus-run-session; do
            command -v "$tool" >/dev/null
          done
          for package in xvfb xauth dbus-x11; do
            dpkg-query -W -f='${Version}' "$package" >/dev/null
          done
          {
            printf 'platform=ubuntu-runner\n'
            dpkg-query -W -f='${Package}\t${Version}\n' xvfb xauth dbus-x11
            for tool in xvfb-run xauth dbus-run-session; do
              printf 'tool=%s path=%s\n' "$tool" "$(command -v "$tool")"
            done
          } | tee "${{ runner.temp }}/tfnf-070-universal-display-tools.tsv"

      - name: Download 0.7.0 candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-candidate-bundle
          path: '${{ runner.temp }}/tfnf-070-universal-bundle'

      - name: Download 0.7.0 public inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfnf-070-universal-public-inputs
          path: '${{ runner.temp }}/tfnf-070-universal-public-inputs'

      - name: Resolve explicit Linux runtime profile
        id: linux_runtime_profile
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          QUALIFICATION_INPUTS: '${{ runner.temp }}/tfnf-070-universal-public-inputs/qualification-inputs-prep.json'
          INRUN_ROOT: '${{ runner.temp }}/tfnf-070-universal-public-inputs'
        run: |
          set -euo pipefail
          PROFILE="$("${{ steps.setup_python.outputs.python-path }}" -B - <<'PY'
          import os
          from pathlib import Path
          from rs9.tf_pypi_nebular070_publish import (
              SYSTEM_WEBKIT_RUNTIME_PROFILE,
              load_qualification_inputs_descriptor,
          )

          descriptor = load_qualification_inputs_descriptor(
              Path(os.environ["QUALIFICATION_INPUTS"]),
              repository=Path(os.environ["GITHUB_WORKSPACE"]),
              phase="qualification-prep",
              inrun_root=Path(os.environ["INRUN_ROOT"]),
          )
          if "system_webkit" not in descriptor or "manylinux" in descriptor:
